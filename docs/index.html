<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <title>Marsdove — Framework Documentation</title>
  <link rel="stylesheet" href="../styles/marsdove.css">
  <style>
    .docs-shell{width:min(calc(100% - 2rem),1200px);margin:auto;padding:2rem 0 6rem}
    .docs-hero{padding:clamp(2rem,6vw,5rem);background:linear-gradient(135deg,var(--surface),var(--primary-light));border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-md)}
    .docs-section{padding:1.5rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md)}
    .docs-demo{padding:1.25rem;background:var(--surface-alt);border:1px dashed var(--border);border-radius:var(--radius-sm)}
    .docs-code{overflow:auto;padding:1rem;border-radius:var(--radius-sm);background:#111827;color:#f9fafb;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}
    .docs-swatch{height:70px;border-radius:var(--radius-sm);border:1px solid var(--border)}
    .docs-kicker{font-family:var(--font-accent);letter-spacing:.08em}
  </style>
</head>
<body>
  <main id="docs"></main>
  <script type="module" src="./main.js"></script>
</body>
</html>
